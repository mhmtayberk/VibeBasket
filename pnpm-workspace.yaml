nodeLinker: hoisted
shamefullyHoist: true
verifyDepsBeforeRun: warn
enableGlobalVirtualStore: false
minimumReleaseAge: 60
minimumReleaseAgeStrict: true
blockExoticSubdeps: true
strictDepBuilds: true
overrides:
  '@hono/node-server': 1.19.15
  baseline-browser-mapping: 2.11.30
  body-parser: 2.3.0
  brace-expansion: 5.0.12
  browserslist: 4.29.4
  fast-uri: 3.1.8
  form-data: 2.5.6
  hono: 4.13.11
  ip-address: 10.7.1
  'nanoid@3': 3.3.20
  proxy-addr: 2.0.8
  qs: 6.16.0
  source-map-js: 1.2.2
  'uuid@9.0.1': 11.1.1
  ws: 8.21.0

packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  keytar: true
  msw: true
  sharp: true
